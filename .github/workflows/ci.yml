name: CI

# Fast PR gate. Everything here runs without a database, without Playwright
# browsers and without hosted credentials, so a PR check costs a few Actions
# minutes. The heavier suites (DB/RLS harnesses, web E2E) live in
# optional-checks.yml and are run on demand.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # No `version:` on purpose: action-setup reads `packageManager`
      # (pnpm@11.26.0) from package.json, so the pin has exactly one home and
      # cannot drift away from what corepack uses locally.
      - uses: pnpm/action-setup@v4
      # .nvmrc pins Node 22; package.json engines say ">=22". Nothing in the
      # dependency tree needs newer, so CI stays on the LTS the repo declares
      # even though the maintainer's machine runs 26.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # Caches the pnpm store keyed on pnpm-lock.yaml.
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r test
      # The root `test:audit3` script also runs scripts/test-db-audit3.sh, which
      # needs a local PostgreSQL. The PR gate runs the acceptance suite only; the
      # SQL harness runs in optional-checks.yml.
      - run: pnpm --filter @friendword/web test:audit3
      - run: pnpm --filter @friendword/web test:ui
