# Scheduled ops runner (third audit H-6).
#
# Connects the existing recurring ops passes (campaign expiration, account
# deletion processing, orphan-media dry-run) to a real scheduler. Until now
# `scripts/run-scheduled-ops.mjs` was documented but never scheduled, so
# expirations and queued deletions only ran when someone remembered to.
#
# GATED BY USER: this workflow is INERT until the repository secrets below are
# added by the maintainer (Settings → Secrets and variables → Actions). With
# them unset, the preflight step fails fast with a clear message instead of
# running against no database. The Claude assistant only names these secrets;
# their VALUES are entered by the user and never appear here or in any diff.
#
#   SUPABASE_URL                  (or NEXT_PUBLIC_SUPABASE_URL)
#   SUPABASE_SERVICE_ROLE_KEY     service-role key — scheduled ops are service-only
#
# The orphan-media sweep runs DRY-RUN here (no --apply): deletions stay a
# reviewed manual drill (see docs/OPS.md). This job only expires campaigns,
# processes queued account deletions, and reports orphan candidates.

name: Scheduled ops

on:
  # Hourly. Campaign expiration and deletion processing are idempotent and
  # claim/lease safe, so an hourly cadence is well within their design.
  schedule:
    - cron: '0 * * * *'
  # Manual drill: run on demand from the Actions tab.
  workflow_dispatch:

# Never overlap runs — a slow pass must finish before the next hour starts.
concurrency:
  group: scheduled-ops
  cancel-in-progress: false

jobs:
  run-scheduled-ops:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Preflight — require ops secrets
        run: |
          if [ -z "$SUPABASE_URL" ] && [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::Scheduled ops are inert until secrets are set. Add SUPABASE_URL (or NEXT_PUBLIC_SUPABASE_URL) in repo Actions secrets."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Scheduled ops are inert until secrets are set. Add SUPABASE_SERVICE_ROLE_KEY in repo Actions secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run scheduled ops (orphan sweep dry-run)
        run: node scripts/run-scheduled-ops.mjs
