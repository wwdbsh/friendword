# Scheduled ops runner (fcp Issue #39, GAP-5).
#
# `scripts/run-scheduled-ops.mjs` has been documented as "the one scheduled
# command" since the second audit, but nothing in this repo ever scheduled it:
# the previous workflow was deleted on 2026-07-25 when the account's Actions
# minutes ran out, and no schedule trigger existed here afterwards. So the
# Storage-touching passes (queued account deletions, orphan-media sweep) only
# ran when a human remembered. This restores the trigger.
#
# SCOPE — this job owns the Node/Storage passes only. The pure-SQL passes stay
# in hosted pg_cron (migration 0043: campaign expiry every 15 min, review
# payload scrub daily 03:30 UTC) and are NOT moved here. run-scheduled-ops.mjs
# re-runs both of those as well; they are idempotent, so the overlap is
# harmless and keeps a single entry point.
#
# CADENCE — daily, matching what docs/OPS.md already assumes for these passes
# ("orphan cleanup: 초기에는 매일 1회 실행"; deletion requests are claim/lease
# safe and the account is already `deleted` at request time). Daily also keeps
# the minute budget honest: this job installs the workspace, so it bills ~3
# min/run → ~90 min/month, versus the ~1,460 min/month the old hourly version
# burned before billing cut it off (DECISIONS 2026-07-25). Safety alerting does
# NOT wait for this job — safety-escalation.yml runs hourly and costs the
# 1-minute minimum.
#
# 03:10 UTC (12:10 KST) runs just before the pg_cron scrub at 03:30 UTC.
#
# The orphan sweep runs DRY-RUN here (no --apply): deletions stay a reviewed
# manual drill (docs/OPS.md). A failure here means a pass errored — read the
# step log, then re-run; every pass is safe to repeat.

name: Scheduled ops

on:
  schedule:
    - cron: '10 3 * * *'
  # Manual drill from the Actions tab.
  workflow_dispatch:

concurrency:
  group: scheduled-ops
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-scheduled-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Registered by the maintainer on 2026-08-11. Values never appear here.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Preflight — require ops secrets
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Missing SUPABASE_URL in repo Actions secrets — scheduled ops cannot run."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY in repo Actions secrets — scheduled ops cannot run."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run scheduled ops (orphan sweep dry-run)
        run: node scripts/run-scheduled-ops.mjs
