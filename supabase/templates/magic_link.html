<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  style="
    background: #fff6ea;
    padding: 32px 16px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  "
>
  <tr>
    <td align="center">
      <table
        role="presentation"
        width="100%"
        cellpadding="0"
        cellspacing="0"
        style="
          max-width: 480px;
          background: #ffffff;
          border: 3px solid #1f1300;
          border-radius: 20px;
          padding: 32px;
        "
      >
        <tr>
          <td>
            <p style="margin: 0 0 16px; font-size: 22px; font-weight: 800; color: #1f1300">
              Friendword
            </p>
            <h1 style="margin: 0 0 8px; font-size: 24px; line-height: 1.2; color: #1f1300">
              Here&rsquo;s your sign-in code.
            </h1>
            <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.5; color: #5c5244">
              Enter this code in the app, or tap the button if you opened this on the same device.
            </p>
            <p
              style="
                margin: 0 0 24px;
                padding: 16px;
                background: #fff6ea;
                border: 3px solid #1f1300;
                border-radius: 14px;
                text-align: center;
                font-size: 32px;
                font-weight: 800;
                letter-spacing: 0.2em;
                color: #1f1300;
              "
            >
              {{ .Token }}
            </p>
            <p style="margin: 0 0 24px; text-align: center">
              <a
                href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&redirect_to={{ .RedirectTo }}"
                style="
                  display: inline-block;
                  padding: 14px 28px;
                  background: #ff5c1f;
                  border: 3px solid #1f1300;
                  border-radius: 999px;
                  color: #ffffff;
                  font-size: 16px;
                  font-weight: 800;
                  text-decoration: none;
                "
                >Sign me in</a
              >
            </p>
            <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #8a8070">
              This code expires in an hour. If you didn&rsquo;t request it, you can safely ignore
              this email.
            </p>
          </td>
        </tr>
      </table>
      <p style="margin: 16px 0 0; font-size: 12px; color: #8a8070">
        Dating, in your friends&rsquo; words.
      </p>
    </td>
  </tr>
</table>
